name: Pipeline CI/CD - Validacao e Deploy

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

# Permissões necessárias para publicar no GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  # ETAPA 1: Continuous Integration (CI)
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout do Código
        uses: actions/checkout@v4

      - name: Validação do Arquivo HTML (CI)
        run: |
          echo "Iniciando validação de sintaxe/presença do arquivo..."
          if [ -f index.html ]; then
            echo "Sucesso: index.html encontrado!"
          else
            echo "Erro: index.html não foi encontrado!"
            exit 1
          fi

  # ETAPA 2: Continuous Delivery/Deployment (CD)
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build-and-test # Garante que o deploy só ocorra se o CI passar
    steps:
      - name: Checkout do Código
        uses: actions/checkout@v4

      - name: Configurar GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload do Artefato
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.'

      - name: Deploy no GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4